name: la_bendita
description: Monitoreo de cacao para fincas — diagnóstico, parcelas y producción.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  supabase_flutter: ^2.10.3
  flutter_dotenv: ^6.0.0
  intl: ^0.20.2
  image_picker: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
    - assets/images/
